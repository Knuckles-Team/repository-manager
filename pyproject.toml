[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-manager"
version = "3.4.0"
description = "Manage your git projects"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12,<3.15"
dependencies = [ "agent-utilities[mcp]>=2.0.0,<3.0.0",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [
    "agent-utilities[mcp]>=2.0.0,<3.0.0"]

agent = [
    "agent-utilities[agent-runtime,logfire]>=2.0.0,<3.0.0",
    "pre-commit>=4.6.0",
    "bump2version>=1.0.1"]

all = [
    "agent-utilities[agent-runtime,logfire]>=2.0.0,<3.0.0",
    "pre-commit>=4.6.0",
    "bump2version>=1.0.1",
    "agent-utilities[mcp]>=2.0.0,<3.0.0"
]

test = [
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0"
]

# P0.7 — several docstrings in this package (`remote_worker_actions.py`,
# `remote_execution/executor.py`, `remote_execution/ssh_executor.py`) refer
# to "repository-manager's 'remote' extra" as the thing that makes
# tunnel-manager's SSH primitives available. Before this, no such extra was
# actually declared anywhere in this file — a real instance of the "built but
# unreachable" pattern this program exists to close. `tunnel-manager` stays
# OPTIONAL (see `_UnavailableInventoryResolver`/`_require_tunnel_manager`):
# every module that imports it degrades honestly, never an ImportError, when
# this extra is not installed.
remote = [
    "tunnel-manager>=2.1.0,<3.0.0"
]

[project.scripts]
repository-manager = "repository_manager.repository_manager:main"
repository-manager-mcp = "repository_manager.mcp_server:mcp_server"
repository-manager-agent = "repository_manager.agent_server:agent_server"

[tool.setuptools.package-data]
repository_manager = ["mcp_config.json", "workspace.yml", "AGENTS.md", "docs_readiness_fleet_manifest.json", "prompts/**", "skills/**", "ontology/**", "connectors/**", "mergequeue_presets/*.yaml", "buildcache_presets/*.yaml",]

[tool.uv]
managed = true
# Same narrow override agent-utilities/agent-webui declare for themselves
# (see agent-utilities' pyproject.toml `[tool.uv]` comment for the full
# "why"): fastmcp-slim ships no non-prerelease under the fastmcp>=4.0.0b1
# floor agent-utilities[mcp] requires, and uv only allows prereleases for a
# package when a ROOT project's own requirement names one -- which this
# repo's requirement (transitively, via agent-utilities[mcp]) now does once
# the path-dependency fix below lets resolution reach this far at all.
override-dependencies = [
    "fastmcp-slim[client,server]>=4.0.0b1",
]

# B6 (REMAINING-ISSUES-DESIGNS.md): `agent-utilities>=2.0.0` (below) is not
# yet published to PyPI (only <=1.26.4 is), so a plain version-range
# dependency is unconditionally unresolvable from this checkout -- BEFORE
# this fix, `uv lock` failed with "only agent-utilities[mcp]<=1.26.4 is
# available". Mirrors the agent-webui/geniusbot BUG-074 fix already proven in
# this fleet: a plain editable PATH dependency instead of a version-range
# one. `.uv-workspace-siblings/agent-utilities` is a local, untracked symlink
# to the real sibling checkout (see `.gitignore`'s matching entry);
# dev/lane-machine-only, materialized once per checkout, never cloned/copied.
#
# Separately (not fixed by this table): this checkout also sits inside the
# /home/apps/workspace uv WORKSPACE root, which lists agent-utilities as a
# member that is itself its own self-contained uv workspace root
# (D-75-1/D-CIP-19/D-W3BP-4) -- uv rejects that ("Nested workspaces are not
# supported") for ANY `uv lock` invocation whose ancestor-directory walk
# reaches /home/apps/workspace, regardless of this repo's own tables
# (verified: even agent-webui/geniusbot, which already carry this identical
# fix, still hit it when run from their canonical, workspace-nested
# location). That is exactly why this program's standing rule is to do all
# work from a real `git worktree add` OUTSIDE /home/apps/workspace (e.g.
# /home/apps/worktrees/<repo>/<branch>) rather than the canonical checkout --
# from such a worktree, /home/apps/workspace is not an ancestor directory at
# all, so uv's walk never reaches it and this second failure mode does not
# arise. `uv lock` from this checkout's OWN canonical path would still hit
# it; that is a separate, pre-existing structural fact about the ecosystem
# workspace's layout, not something this table can fix from inside one
# member's pyproject.toml.
[tool.uv.sources]
agent-utilities = { path = ".uv-workspace-siblings/agent-utilities", editable = true }

[project.entry-points."agent_utilities.skill_providers"]
repository-manager = "repository_manager.skills"

[project.entry-points."agent_utilities.ontology_providers"]
repository-manager = "repository_manager.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
repository-manager = "repository_manager.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
repository-manager = "repository_manager.prompts"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "universal-skills",
]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]


[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config", "kw"]
