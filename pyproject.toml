[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-manager"
version = "3.5.6"
description = "Manage your git projects"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12,<3.15"
dependencies = [ "scion-sdk[mcp]>=0.6.4,<0.7.0", "psutil>=7.2.2", "requests>=2.34.2",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [
    "scion-sdk[mcp]>=0.6.4,<0.7.0"]

all = [
    "pre-commit>=4.7.0",
    "bump2version>=1.0.1",
    "scion-sdk[mcp]>=0.6.4,<0.7.0"
]

test = [
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0"
]

# P0.7 — several docstrings in this package (`remote_worker_actions.py`,
# `remote_execution/executor.py`, `remote_execution/ssh_executor.py`) refer
# to "repository-manager's 'remote' extra" as the thing that makes
# tunnel-manager's SSH primitives available. Before this, no such extra was
# actually declared anywhere in this file — a real instance of the "built but
# unreachable" pattern this program exists to close. `tunnel-manager` stays
# OPTIONAL (see `_UnavailableInventoryResolver`/`_require_tunnel_manager`):
# every module that imports it degrades honestly, never an ImportError, when
# this extra is not installed.
remote = [
    "tunnel-manager>=2.1.0,<3.0.0"
]

[project.scripts]
repository-manager = "repository_manager.repository_manager:main"
repository-manager-mcp = "repository_manager.mcp_server:mcp_server"
repository-manager-install-merge-queue-runner = "repository_manager.merge_queue_runner_install:main"
repository-manager-governance = "repository_manager.governance.cli:main"

[tool.setuptools.package-data]
repository_manager = ["mcp_config.json", "workspace.yml", "AGENTS.md", "docs_readiness_fleet_manifest.json", "skills/**", "ontology/**", "connectors/**", "development/contracts/*.json", "mergequeue_presets/*.yaml", "governance/*.yaml", "buildcache_presets/*.yaml", "systemd/*.service", "systemd/*.timer",]

[tool.uv]
managed = true
# fastmcp-slim ships no non-prerelease under the fastmcp>=4.0.0b1 floor
# scion-sdk[mcp] requires, and uv allows prereleases only when a
# root requirement names one.
override-dependencies = [
    "fastmcp-slim[client,server]>=4.0.0b1",
]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "universal-skills>=1.3.11",
]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config", "kw"]

[tool.pipelines.codespell]
ignore_words = ["unparseable"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."scion_sdk.connector"]
repository-manager = "repository_manager"
