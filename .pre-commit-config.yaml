# Without this, `pre-commit install` wires ONLY the pre-commit hook, so `git push`
# runs nothing and every hook staged pre-push is silently dead code.
default_install_hook_types: [pre-commit, pre-push]
default_language_version:
  python: python3
exclude: 'dotnet|node_modules'
ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: 'monthly'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
  - id: check-ast
  - id: check-yaml
    args: ["--unsafe"]
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
    exclude: .gitignore
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: no-commit-to-branch
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 6fec9b7edb08fd9989088709d864a7826dc74e80 # v0.15.12
  hooks:
  - id: ruff-check
    args: ["--ignore=E402,B008,E501"]
    exclude: ^(tests/|test/|scripts/|script/)
  - id: ruff-format
    args: ["--check"]
    exclude: ^(tests/|test/|scripts/|script/)
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: fc0f09a29bb495f4a91f00266155d6282d52485d # v1.20.2
  hooks:
  - id: mypy
    additional_dependencies: [pydantic==2.13.4, types-PyYAML==6.0.12.20260518, types-requests==2.33.0.20260518,
        types-setuptools==83.0.0.20260706]
    args: ["--ignore-missing-imports"]
- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: [".", "--min-confidence", "95", "--exclude", "node_modules,dotnet,.venv,venv,node_modules,.git,build,dist"]
    require_serial: true
- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
  hooks:
  - id: codespell
    args: ["-L", "ans,linar,nam,tread,ot,"]
    exclude: (?x)^(repository_manager/skills/git-cli-docs/reference/.*)$
- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    args: ["--skip", "B101,B404,B603"]
    exclude: ^(tests/|test/|scripts/|script/|__tests__/)
- repo: https://github.com/nbQA-dev/nbQA
  rev: d31b7eae1767c43460afb3ba130e0a6602933abe # 1.9.1
  hooks:
  - id: nbqa-ruff
- repo: local
  hooks:
  # Tier 0 (CONCEPT:RM-PARSE-GATE). Deliberately FIRST among the local hooks
  # and deliberately cheap: it answers only "does every source file still
  # parse?", in seconds, with no build, environment or network. Five
  # epistemic-graph branches once merged into a tree where four files did not
  # parse at all — including a Cargo.toml with a duplicate `members` key that
  # cargo refused outright — and nothing caught it until something tried to
  # compile, hours later. Everything below this line is more expensive and none
  # of it can produce a meaningful verdict on a tree that is not even
  # syntactically valid.
  - id: parse-gate
    name: Tier 0 — every source file parses
    entry: python -m repository_manager.parse_gate .
    language: system
    pass_filenames: false
    always_run: true
  - id: check-import-safety
    name: Cross-platform import safety (native + simulated-Windows fcntl/termios/pwd/resource)
    # Same tool as agent-utilities' own check-import-safety hook (copied,
    # not vendored as a dependency, so this hook has no environment-sync
    # prerequisite beyond what pytest below already needs). Walks every
    # repository_manager module, with fcntl/termios/pwd/resource poisoned
    # out of sys.modules first to reproduce a Windows import failure on
    # this POSIX dev machine -- see scripts/check_import_safety.py's own
    # docstring for exactly what --simulate-windows does and does not
    # model (deliberately does not flip sys.platform/os.name).
    #
    # CURRENTLY RED, expected: repository_manager/repository_manager.py
    # (the package's own core module) eagerly imports
    # repository_manager.canonical_guard, which has an unguarded top-level
    # `import fcntl` -- so under this shim (and on a real Windows
    # interpreter) `import repository_manager` fails OUTRIGHT, before
    # discover_modules can even enumerate the rest of the package. No
    # --exclude can route around this the way agent-utilities' hook does
    # for its per-module cases -- the failure is structural, not
    # per-module. Five more repository_manager files have the identical
    # unguarded top-level `import fcntl` (fairness.py, task_queue.py,
    # reservations.py, canonical_guard.py, stash_guard.py) plus 4 more
    # lazy (function-body) sites in build_artifacts.py invisible to this
    # static walk. This hook stays red until they are fixed -- that is the
    # point: repository-manager (the tool that runs the FLEET's gates)
    # cannot currently be imported on Windows at all.
    entry: python scripts/check_import_safety.py --package repository_manager --simulate-windows
    language: system
    pass_filenames: false
    always_run: true
  - id: okf-no-legacy-concepts
    name: OKF-CIS — no legacy CONCEPT ids
    entry: python scripts/run_agent_utilities_gate.py --script scripts/check_no_legacy_markers.py -- .
    language: system
    pass_filenames: false
    always_run: true
  - id: check-mermaid
    name: Check Mermaid syntax
    entry: python scripts/run_agent_utilities_gate.py --script scripts/mermaid_linter.py --
    language: system
    files: \.md$
    pass_filenames: true
  - id: lane-guard
    name: Lane guard — canonical checkout read-only + stray CARGO_TARGET_DIR (D-CP-3/D-CP-4 reach)
    entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ -n "$AGENT_UTILITIES_ROOT" ]; then root="$AGENT_UTILITIES_ROOT"; else d="$repo"; root=""; while [ "$d" != "/" ]; do if [ -d "$d/agent-utilities/scripts" ]; then root="$d/agent-utilities"; break; fi; d=$(dirname "$d"); done; fi; if [ ! -d "$root/scripts" ]; then echo "REFUSED - cannot locate agent-utilities/scripts from $repo (set AGENT_UTILITIES_ROOT)" >&2; exit 1; fi; python3 "$root/scripts/check_lane_guard.py"'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-stubs
    name: Check for Active Stubs and TODOs
    entry: python scripts/run_agent_utilities_gate.py --script scripts/check_stubs.py --
    language: system
    types: [python]
  - id: mermaid-validate
    name: mermaid-validate
    entry: mermaid-validate
    language: node
    additional_dependencies: ['@zabaca/mermaid-validate@1.0.1']
    types: [markdown]
    pass_filenames: true
  - id: check-agent-standards
    name: check agent standards
    entry: |-
      bash -c 'for f in $(find . -type f -name "agent_server.py" -not -path "*/\.venv/*" -not -path "*/__pycache__/*"); do grep -q "warnings.filterwarnings" "$f" && grep -q "file=sys.stderr" "$f" || { echo "Missing warnings.filterwarnings or file=sys.stderr in $f"; exit 1; }; done'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-cli-help
    name: check cli help
    entry: |-
      bash -c 'for f in $(find . -type f \( -name "mcp_server.py" -o -name "agent_server.py" \) -not -path "*/\.venv/*" -not -path "*/__pycache__/*"); do mod=$(echo "$f" | sed -e "s/^\.\///" -e "s/\.py$//" -e "s/\//./g"); python scripts/run_agent_utilities_gate.py --module "$mod" -- --help >/dev/null || exit 1; done'
    language: system
    pass_filenames: false
    always_run: true
  - id: mcp-readme-table
    name: sync MCP tools table in README
    entry: |-
      python scripts/run_agent_utilities_gate.py --module agent_utilities.mcp.readme_tools
    language: system
    files: ^(README\.md|.*/mcp_server\.py|.*/mcp/.*\.py)$
    pass_filenames: false
  - id: readme-env-vars
    name: sync env-vars table in README
    entry: |-
      python scripts/run_agent_utilities_gate.py --module agent_utilities.mcp.readme_env_vars
    language: system
    files: ^(README\.md|\.env\.example)$
    pass_filenames: false
  - id: readme-mcp-examples
    name: sync mcp_config examples in README + env blocks
    entry: |-
      python scripts/run_agent_utilities_gate.py --module agent_utilities.mcp.readme_mcp_examples
    language: system
    files: ^(README\.md|\.env\.example|mcp_config.*\.json|.*/mcp_config.*\.json|.*/mcp_server\.py)$
    pass_filenames: false
  - id: env-var-drift
    name: check env-var/config drift
    entry: python scripts/run_agent_utilities_gate.py --module agent_utilities.mcp.check_env_var_drift -- --check
    language: system
    pass_filenames: false
    files: ^(README\.md|\.env\.example|mcp_config.*\.json|.*/mcp_config.*\.json|docker/.*compose.*\.ya?ml|.*/auth\.py|.*/mcp_server\.py)$
  - id: check-bumpversion
    name: validate bumpversion config
    # B6/C2 (REMAINING-ISSUES-DESIGNS.md): this is the ONE gate in this repo
    # that already enforces version-mirror consistency (every file registered
    # in .bumpversion.cfg, via bump2version's own dry-run). Extended in place
    # -- rather than adding a second, parallel gate -- to also cover the two
    # generated lock artifacts .bumpversion.cfg was never responsible for:
    # uv.lock's own self-package version (B6: it silently drifted a full
    # major version behind pyproject.toml, because it is regenerated by
    # `uv lock`, not text-substituted by the bumper) and requirements.txt's
    # dependency ranges (C2: it drifted to pin an unpublishable
    # agent-utilities floor with nothing catching it, because the fleet's
    # version/lockfile edict only ever named uv.lock).
    entry: |-
      bash -c 'if [ -f ".bumpversion.cfg" ]; then bump2version patch --dry-run --allow-dirty; fi && python scripts/run_agent_utilities_gate.py --script scripts/check_lockfile_version_mirrors.py -- .'
    language: system
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: pytest
    name: pytest
    entry: bash -c 'test_target="tests"; for d in tests/unit test/unit tests test; do if [ -d "$d" ]; then test_target="$d"; break; fi; done; python scripts/run_agent_utilities_gate.py --module pytest -- "$test_target" -q --tb=short -m "not slow and not integration" --timeout=60'
    language: system
    types: [python]
    pass_filenames: false
    always_run: true
- repo: https://github.com/AleksaC/hadolint-py
  rev: 458cb25edf664682e3e856a53a2f9af33e068297 # v2.14.0
  hooks:
  - id: hadolint
    args:
    - --ignore=DL3008
    - --ignore=DL3015
    - --ignore=DL3009
    - --ignore=DL4006
    - --ignore=SC2102
- repo: local
  hooks:
  - id: docker-compose-check
    name: Validate docker compose files
    entry: bash -c 'for compose in docker/*compose*.y*ml; do docker compose --env-file scripts/fixtures/precommit-compose.env -f "$compose" config --no-env-resolution --quiet || exit 1; done'
    language: system
    pass_filenames: false
    files: ^docker/.*compose.*\.ya?ml$
- repo: local
  hooks:
  - id: gate-toolchain-coverage
    name: Gate toolchain coverage — image can run every fleet-declared gate (D-MQ-8/node-pnpm mirror)
    # `rm__merge_queue`'s (and `rm_gates`'/`scanner.py`'s) gate subprocesses run
    # INSIDE this image (docker/Dockerfile) at runtime -- D-MQ-8 documents the
    # defect class: a target repo's `.pre-commit-config.yaml`/`.mergequeue.yaml`
    # can declare ANY `language: system` toolchain, and without it on PATH the
    # gate auto-rejects in seconds reading exactly like a real failure. That
    # was fixed once by hand for cargo, then drifted again for node/pnpm
    # (agent-webui) until this hook existed. Rather than re-trusting a
    # hand-maintained package list to stay current, this DERIVES the required
    # toolchain set from the fleet's own configs every run and fails loudly on
    # anything it cannot classify -- see the script's own header for the full
    # design and its documented scope boundary (only sees literal command text
    # in these two file types; a transitively-pulled build dependency such as
    # cmake is out of its reach by construction).
    #
    # Static-Dockerfile mode: no Docker daemon required, ~3s warm over the
    # whole fleet (measured) -- comfortably inside the pre-commit FAST budget.
    # The authoritative check is `--image <built-tag>` in CI against the real
    # build; this hook is the cheap, no-daemon local mirror of that.
    #
    # `manual`-only, NOT a default-stage blocking hook -- same reasoning as
    # this fleet's own D-W6PC-3 precedent (agent-webui's `lint` hook): the
    # fleet-wide scan surfaces real, PRE-EXISTING debt this lane does not own
    # fixing (today: epistemic-graph's go-client mergequeue gate has no `go`
    # in this image, and two repos' bare `pytest` entries -- see P0.2 in
    # PHASE-0-DEV-VELOCITY.md -- are unclassifiable without knowing whether
    # they resolve via a target repo's own venv). Blocking every future
    # commit to THIS repo on debt it did not introduce is the exact
    # "absolute local gate on a red baseline" anti-pattern D-W5GR-4 exists to
    # avoid. Run on demand: `pre-commit run gate-toolchain-coverage
    # --hook-stage manual --all-files`. Real enforcement of a NEW gap (a
    # regression this lane DID introduce) belongs in CI as a differential
    # check once one exists for this repo's own `.mergequeue.yaml`-style
    # gating; until then this is the deliberate, checked-in way to see the
    # current backlog, not to fail every push over it.
    entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ -n "$AGENT_UTILITIES_ROOT" ]; then root="$AGENT_UTILITIES_ROOT"; else d="$repo"; root=""; while [ "$d" != "/" ]; do if [ -d "$d/agent-utilities/scripts" ]; then root="$d/agent-utilities"; break; fi; d=$(dirname "$d"); done; fi; if [ ! -d "$root/scripts" ]; then echo "REFUSED - cannot locate agent-utilities/scripts from $repo (set AGENT_UTILITIES_ROOT)" >&2; exit 1; fi; python3 scripts/check_gate_toolchain_coverage.py --fleet-root "$(dirname "$root")" --dockerfile docker/Dockerfile'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
- repo: local
  hooks:
  - id: security-sanitizer
    name: Security and Garbage Sanitizer
    entry: python scripts/security_sanitizer.py
    language: python
    pass_filenames: false
    always_run: true
