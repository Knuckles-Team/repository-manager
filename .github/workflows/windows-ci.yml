name: Windows coverage

# ─────────────────────────────────────────────────────────────────────────
# This repo previously had NO test/lint CI at all -- pipeline.yml only
# builds and publishes to PyPI/Docker via a self-hosted runner (no test
# step), and docs.yml/pages.yml only build documentation. This is the
# FIRST workflow in this repo that actually imports and exercises the
# package.
#
# Report-only by design (continue-on-error on every step, like
# scion-sdk' advisory.yml two-workflow model): repository-manager's
# publish pipeline is not gated on this, consistent with "do not disable or
# weaken any existing CI job" -- this only adds signal, it does not touch
# pipeline.yml.
#
# Every FEATURE in this repo is required to work on both platforms -- only
# its MECHANISM may be platform-specific. So the exclusions below are two
# different categories, not one "can't run on Windows" bucket:
#
# (A) INFRASTRUCTURE-UNAVAILABLE -- cannot exist on a GitHub-hosted Windows
#     runner: `integration`-marked tests (subprocess/TestClient harness
#     assumptions), `slow`-marked tests (long-running, excluded on ANY
#     platform for a per-push job), and anything assuming Docker-in-CI or a
#     self-hosted build host (none are in the selected subset below).
#
# (B) PORTABILITY -- every POSIX-only API in the package now sits behind
#     repository_manager.portable_fs (directory handles without dir_fd,
#     XDG-or-%LOCALAPPDATA% state dirs, process-tree termination, junction
#     fallback for directory links, O_BINARY). The import-safety and unit-test
#     steps below therefore run WITHOUT continue-on-error: a red step is a real
#     Windows regression, and the job fails visibly instead of reporting
#     coverage it does not have. The job is not a required check, so it never
#     blocks the publish pipeline. Tests that need POSIX-only machinery
#     (systemd, procfs, cgroups) are marked `integration` and are excluded here
#     as category (A).
# ─────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - 'repository_manager/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/windows-ci.yml'
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  windows:
    name: Windows tests
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync test environment
        run: uv sync --frozen --extra test

      - name: Cross-platform import safety (real Windows interpreter)
        run: uv run --no-sync python scripts/check_import_safety.py
          --package repository_manager --exclude repository_manager.remote_execution.fakes

      # Same marker filter this repo's own pre-commit pytest hook already
      # uses at commit time (fast, no integration/slow).
      - name: Unit tests (fast subset -- not slow, not integration)
        run: >-
          uv run --no-sync python -m pytest tests -q --tb=short
          -m "not slow and not integration and not native" --timeout=120

      - name: Windows coverage summary
        if: always()
        run: |
          echo "## Windows test run" >> "$GITHUB_STEP_SUMMARY"
          echo "Import-safety and the fast unit-test subset ran on windows-latest." >> "$GITHUB_STEP_SUMMARY"
          echo "A red step is a real Windows regression; the job is not a required" >> "$GITHUB_STEP_SUMMARY"
          echo "check, so it does not block the publish pipeline." >> "$GITHUB_STEP_SUMMARY"
