name: Windows coverage

# Use the same pinned sibling sources and non-native environment as Linux CI.
# Setup, import, and test failures must fail this job; release policy is separate.

on:
#   * The import-safety step below is currently expected to FAIL: this
#     package's own core module (repository_manager/repository_manager.py)
#     eagerly imports repository_manager.canonical_guard, which has an
#     unguarded top-level `import fcntl` -- so `import repository_manager`
#     fails OUTRIGHT on a real Windows interpreter, before a single test
#     can even collect. Five more files share the identical unguarded
#     top-level `import fcntl` (fairness.py, task_queue.py,
#     reservations.py, canonical_guard.py, stash_guard.py), plus 4 more
#     lazy (function-body) sites in build_artifacts.py invisible to a
#     static import walk. See .pre-commit-config.yaml's check-import-safety
#     hook for the same finding at commit time. Left unexcluded and RED on
#     purpose -- the tool that runs the FLEET's gates currently cannot be
#     imported on Windows at all, and a job that went green by skipping
#     that would be exactly the "gate reporting coverage it does not have"
#     failure this program exists to catch.
# ─────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - 'repository_manager/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/windows-ci.yml'
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  windows:
    name: Windows coverage
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap pinned test environment
        id: bootstrap
        run: scripts/bootstrap.sh

      - name: Cross-platform import safety (real Windows interpreter)
        id: imports
        run: uv run --frozen --no-sync python scripts/check_import_safety.py --package repository_manager

      # Preserve the existing fast, non-native subset. Run it even when the
      # import check fails, so both checks retain their own failure evidence.
      - name: Unit tests (fast subset -- not slow, not integration)
        id: tests
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: >-
          uv run --frozen --no-sync python -m pytest tests -q --tb=short
          -m "not slow and not integration and not native" --timeout=120

      - name: Windows coverage summary
        if: always()
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          IMPORT_OUTCOME: ${{ steps.imports.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            echo "## Windows validation"
            echo "Bootstrap: $BOOTSTRAP_OUTCOME"
            echo "Import safety: $IMPORT_OUTCOME"
            echo "Unit tests: $TEST_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
