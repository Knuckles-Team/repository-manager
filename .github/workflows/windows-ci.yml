name: Windows coverage

# Use the same pinned sibling sources and non-native environment as Linux CI.
# Setup, import, and test failures must fail this job; release policy is separate.

on:
  pull_request:
    paths:
      - 'repository_manager/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/windows-ci.yml'
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  windows:
    name: Windows coverage
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap pinned test environment
        id: bootstrap
        run: scripts/bootstrap.sh

      - name: TEMPORARY protective DACL diagnostics
        continue-on-error: true
        run: |
          uv run --frozen --no-sync python - <<'PYEOF'
          import ctypes as c, os
          from tests.test_windows_filesystem import NativeFixture
          fx = NativeFixture({})
          ntdll = c.WinDLL("ntdll")
          advapi = c.WinDLL("advapi32", use_last_error=True)
          class OBI(c.Structure):
              _fields_ = [("Attributes", c.c_uint32), ("GrantedAccess", c.c_uint32), ("rest", c.c_uint32 * 12)]
          ntdll.NtQueryObject.argtypes = [c.c_void_p, c.c_int, c.c_void_p, c.c_uint32, c.c_void_p]
          advapi.SetKernelObjectSecurity.argtypes = [c.c_void_p, c.c_uint32, c.c_void_p]
          advapi.InitializeSecurityDescriptor.argtypes = [c.c_void_p, c.c_uint32]
          advapi.SetSecurityDescriptorDacl.argtypes = [c.c_void_p, c.c_int, c.c_void_p, c.c_int]
          def granted(raw):
              obi = OBI(); st = ntdll.NtQueryObject(raw, 0, c.byref(obi), c.sizeof(obi), None)
              return hex(obi.GrantedAccess), hex(st & 0xFFFFFFFF)
          try:
              with fx.pin() as parent:
                  print("parent granted", granted(parent._raw))
                  f = fx.fs.create_exclusive(parent, "diag.bin")
                  raw = f._raw
                  print("created granted", granted(raw))
                  path = fx.workspace / "diag.bin"
                  try:
                      os.link(path, fx.external / "diag-link.bin"); print("link: CREATED")
                  except OSError as e:
                      print("link refused", e.winerror)
                  acl = f._restore_dacl
                  print("acl bytes", len(acl), acl[:8].hex())
                  for flags in (0x4, 0x4 | 0x20000000):
                      sd = c.create_string_buffer(64); buf = c.create_string_buffer(acl, len(acl))
                      advapi.InitializeSecurityDescriptor(sd, 1)
                      advapi.SetSecurityDescriptorDacl(sd, 1, buf, 0)
                      ok = advapi.SetKernelObjectSecurity(raw, flags, sd)
                      print("SetKernelObjectSecurity flags", hex(flags), ok, c.get_last_error())
                  fx.fs.discard_created(f)
                  f.close()
          finally:
              fx.observations = {}
          PYEOF

      - name: Cross-platform import safety (real Windows interpreter)
        id: imports
        run: uv run --frozen --no-sync python scripts/check_import_safety.py --package repository_manager

      # Preserve the existing fast, non-native subset. Run it even when the
      # import check fails, so both checks retain their own failure evidence.
      - name: Unit tests (fast subset -- not slow, not integration)
        id: tests
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: >-
          uv run --frozen --no-sync python -m pytest tests -q --tb=short
          -m "not slow and not integration and not native" --timeout=120

      # Native Windows qualification: reuse the existing environment; install nothing.
      # This runner-enforced timeout also bounds native calls that cannot return.
      - name: Windows filesystem native qualification
        id: native_probe
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 15
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          evidence_dir="$RUNNER_TEMP/windows-native-probe"
          mkdir -p "$evidence_dir"
          printf '%s\n' '{"status":"BLOCKED_OR_INTERRUPTED","activation_qualified":false,"cases":[]}' > "$evidence_dir/qualification.json"
          ./.venv/Scripts/python.exe -c '
          import ctypes, json, os, platform, sys
          from pathlib import Path
          accepted = (sys.platform == "win32" and sys.version_info[:2] == (3, 12)
                      and platform.python_implementation() == "CPython"
                      and ctypes.sizeof(ctypes.c_void_p) == 8
                      and ctypes.sizeof(ctypes.c_wchar) == 2 and __debug__)
          record = {"status": "READY" if accepted else "BLOCKED",
                    "activation_qualified": False, "python": sys.version,
                    "system": sys.platform, "machine": platform.machine(),
                    "windows_build": platform.version(), "assertions": __debug__,
                    "sha": os.environ.get("GITHUB_SHA"),
                    "run_id": os.environ.get("GITHUB_RUN_ID"),
                    "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT")}
          (Path(sys.argv[1]) / "environment.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8")
          raise SystemExit(0 if accepted else 2)
          ' "$evidence_dir"
          ./.venv/Scripts/python.exe -c "import runpy; runpy.run_path('tests/test_windows_filesystem.py', run_name='__main__')" \
            --qualify-windows \
            --expected-backend-sha256 47c1ffa05cd2481be06188886b6f161d7259e3d832cc4acceb6c7f861438085e \
            --expected-tests-sha256 82913c2bb58ff607abebbdc42c5c71ae5bc0b4c3b9807245a74324acaef65668 \
            --output "$evidence_dir/qualification.json" --repetitions 3

      - name: Retain Windows native qualification evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-native-probe/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Windows coverage summary
        if: always()
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          IMPORT_OUTCOME: ${{ steps.imports.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          NATIVE_PROBE_OUTCOME: ${{ steps.native_probe.outcome }}
        run: |
          {
            echo "## Windows validation"
            echo "Bootstrap: $BOOTSTRAP_OUTCOME"
            echo "Import safety: $IMPORT_OUTCOME"
            echo "Unit tests: $TEST_OUTCOME"
            echo "Native qualification: $NATIVE_PROBE_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
