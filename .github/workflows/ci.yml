name: CI

# The same gates a contributor runs locally: bootstrap, then this repository's
# own .pre-commit-config.yaml. With CI set, a gate that cannot run fails
# (CANNOT RUN) instead of skipping.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The official spec-status gate verifies landing provenance from history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Bootstrap
        # The standard connector environment: the locked environment alone sets
        # up Python and the hooks' interpreter (scripts/bootstrap.sh is no longer
        # tracked; uv sync + pre-commit install replace it).
        run: uv sync --frozen --python 3.12 --extra test --extra all
      - name: Put the locked environment on PATH
        # system-language hooks run `python`; it must be the bootstrapped .venv.
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Prepare synthetic Compose environment
        run: install -m 600 scripts/fixtures/precommit-compose.env .env
      - name: Install the operator-owned identity catalog
        # Never committed: it comes from the PROHIBITED_IDENTITY_CATALOG Actions
        # variable, as in the shared connector pipeline. Without it the
        # tracked-privacy hook fails closed.
        env:
          PROHIBITED_IDENTITY_CATALOG: ${{ vars.PROHIBITED_IDENTITY_CATALOG }}
        run: |
          if [ -n "${PROHIBITED_IDENTITY_CATALOG:-}" ]; then
            mkdir -p "$HOME/.config/arbora/governance"
            printf '%s' "$PROHIBITED_IDENTITY_CATALOG" > "$HOME/.config/arbora/governance/prohibited-identities.json"
          fi
      - name: Pre-commit gates
        # The locked pre-commit, so system hooks resolve `python` to .venv.
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
