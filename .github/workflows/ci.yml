name: CI

# The same gates a contributor runs locally: bootstrap, then this repository's
# own .pre-commit-config.yaml. With CI set, a gate that cannot run fails
# (CANNOT RUN) instead of skipping.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Bootstrap
        run: scripts/bootstrap.sh
      - name: Prepare synthetic Compose environment
        run: install -m 600 scripts/fixtures/precommit-compose.env .env
      - name: Pre-commit gates
        run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
