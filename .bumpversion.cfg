[bumpversion]
current_version = 3.5.3
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:README.md]
search = Version: {current_version}
replace = Version: {new_version}

# The image intentionally follows the last public package while the source
# release is prepared; the next bump advances it to the current source version.
[bumpversion:file(mcp-img):docker/Dockerfile]
search = repository-manager[mcp]==3.5.1
replace = repository-manager[mcp]=={current_version}
