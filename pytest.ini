[pytest]
timeout = 300
asyncio_mode = auto
testpaths = tests
markers =
    spec(id): binds a test to an owning public specification requirement
    integration: marks tests as integration (requires LLM server, excluded from pre-commit)
    slow: marks tests as slow (excluded from quick validation sweeps)
    native: needs the compiled epistemic-graph kernel (scripts/bootstrap.sh --native); excluded from the default gates
addopts = -m "not integration"
